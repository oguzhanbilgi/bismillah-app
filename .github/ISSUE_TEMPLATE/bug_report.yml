name: Bug report
description: Report a problem or unexpected behavior in the app
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do **not** include personal data, credentials,
        or device identifiers. For security vulnerabilities, use the process in
        [SECURITY.md](../blob/main/SECURITY.md) instead of a public issue.
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Shown on the About screen (e.g. 0.1.0-alpha.1+1).
      placeholder: 0.1.0-alpha.1+1
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device / model
      placeholder: e.g. Samsung Galaxy A36
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Android / iOS version
      placeholder: e.g. Android 16
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Tap ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: Paste relevant logs. Remove any personal data before pasting.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: Any screenshots or logs I attach contain no personal data, credentials, or device identifiers.
          required: true
