# Bismillah — statik analiz ve lint yapılandırması.
# Temel set: flutter_lints; üzerine proje disiplin kuralları eklenmiştir
# (06_FLUTTER_ARCHITECTURE §29 kalite kapıları).
#
# Mimari yasaklar (widget'tan Firebase/Isar importu, token dışı renk/spacing,
# hardcoded user-facing string) şimdilik code review kapılarıyla korunur;
# custom_lint kural seti ilgili entegrasyon görevlerinde eklenecek.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures
    - unnecessary_lambdas
    - unnecessary_parenthesis
