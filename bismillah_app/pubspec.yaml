name: bismillah_app
description: "Bismillah — premium Islamic lifestyle companion. Flutter app scaffold and foundation."
publish_to: 'none'

version: 0.1.0-alpha.1+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  drift: ^2.34.1
  drift_flutter: ^0.3.0
  firebase_core: ^4.11.0
  # 6.5.5, firebase_core 4.12.0 ile derlenmiyor (FirebasePlugin yok);
  # ekosistem düzelene kadar 6.5.4'e sabitlendi (CHECKPOINT 06).
  firebase_auth: 6.5.4
  shared_preferences: ^2.5.5
  adhan_dart: ^2.0.1
  geolocator: ^14.0.3
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
# 6.3.4, firebase_core 4.11/4.12.0 ile derlenmiyor (FirebasePlugin yok);
  # 4.12.1 de kendi platform-interface çakışması yüzünden çözülemiyor.
  # Ekosistem düzelene kadar 6.3.3'e sabitlendi (CHECKPOINT 06).
  cloud_functions: 6.3.3
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  http: ^1.6.0
  audio_service: ^0.18.19
  # Resmî kaynak bağlantılarını SİSTEM TARAYICISINDA açmak için (TASK 056A).
  # Sürüm bilinçli olarak SABİTLENMİŞTİR: `pub add` ile kontrolsüz "latest"
  # alınmaz; yükseltme ayrı bir kararla yapılır.
  url_launcher: 6.3.2
  # Uygulama sürüm/build bilgisini göstermek için (TASK 058 §8). Sürüm
  # `pubspec.lock`'ta zaten çözümlenmiş transitive değere sabitlenmiştir;
  # kontrolsüz "latest" alınmaz.
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
flutter:
  uses-material-design: true

  assets:
    - assets/quran/chapters_v1.json
    - assets/quran/verses_uthmani_v1.json
    - assets/quran/verse_pages_v1.json
    - assets/quran/search/quran_search_index_v1.json
    - assets/quran/translations/quranenc_turkish_rwwad_v1_0_4.json
    # Doğrulanmış İslami bilgi tabanı (TASK 056) — offline-first.
    - assets/content/learn/sources.json
    - assets/content/learn/categories.json
    - assets/content/learn/articles_tr.json
    - assets/content/learn/articles_en.json
    - assets/content/learn/articles_ar.json
